name: Deploy control plane
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: aiflux-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, aiflux-private]
    environment: aiflux-development
    env:
      AZURE_RESOURCE_GROUP: rg-aiflux-fdpo-dev
      AZURE_SUBSCRIPTION_ID: 4d75ed7f-75ab-4db6-b1f3-263f240d1450
      ACR_NAME: ${{ vars.AIFLUX_ACR_NAME }}
      API_APP_NAME: ${{ vars.AIFLUX_API_APP_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed deployment configuration
        env:
          APPROVED: ${{ vars.AIFLUX_INFRASTRUCTURE_APPROVED }}
        run: |
          test "$APPROVED" = true
          test -n "$ACR_NAME"
          test -n "$API_APP_NAME"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: 4d75ed7f-75ab-4db6-b1f3-263f240d1450
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify control plane before publication
        run: |
          python -m pip install -e ".[dev]"
          ruff check services/control-plane/src tests/unit
          mypy
          pytest -q
      - name: Build immutable image and deploy
        env:
          AIFLUX_DATABASE_URL: ${{ vars.AIFLUX_DATABASE_URL }}
        run: |
          test -n "$AIFLUX_DATABASE_URL"
          alembic -c services/control-plane/alembic.ini upgrade head
          REGISTRY=$(az acr show --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          IMAGE="$REGISTRY/aiflux-control-plane:$GITHUB_SHA"
          docker build -f services/control-plane/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$API_APP_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" --container-image-name "$IMAGE" \
            --output none
      - name: Verify private-origin readiness
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "https://$API_APP_NAME.azurewebsites.net/ready"
