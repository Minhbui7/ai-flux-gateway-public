version: v1.1.0
steps:
  - cmd: >-
      {{.Run.Registry}}/aiflux/api@sha256:d689dbae4a590ef78060dbda5b6e0fbc595e3750a2fc3d045e074bbfcd87b412
      python -c 'import subprocess,time,httpx,pyodbc,aiflux.tls;
      p=subprocess.Popen(["uvicorn","aiflux.app:app","--host","127.0.0.1","--port","8000","--no-access-log"]);
      time.sleep(5);
      h=httpx.get("http://127.0.0.1:8000/health");
      r=httpx.get("http://127.0.0.1:8000/ready");
      c=httpx.get("http://127.0.0.1:8000/.well-known/acme-challenge/not-a-real-token");
      p.terminate(); p.wait(timeout=10);
      assert h.status_code==200,h.status_code;
      assert r.status_code==503,r.status_code;
      assert c.status_code==404,c.status_code;
      assert "ODBC Driver 18 for SQL Server" in pyodbc.drivers();
      from aiflux.ingestion import extract_safety;
      from aiflux.catalog import BackendEntry;
      assert extract_safety([{"source":"aiflux","metadata":"{\"category\":\"ContentSafety\",\"action\":\"blocked\"}"}])==[("ContentSafety","blocked")];
      assert BackendEntry(id="synthetic-endpoint",region="swedencentral").region=="swedencentral";
      print("Verified immutable API image: health 200, unconfigured readiness 503, challenge off, ODBC 18, native safety metadata and endpoint catalog support")'
    timeout: 60
